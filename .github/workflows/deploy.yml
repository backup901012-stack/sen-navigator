name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build (static export)
        working-directory: web
        env:
          PAGES_EXPORT: "1"
          # next.config.ts 會自動補前導斜線（帶或不帶皆可）
          BASE_PATH: sen-navigator
          NEXT_PUBLIC_SITE_URL: https://backup901012-stack.github.io/sen-navigator
        run: |
          npm run build
          touch out/.nojekyll

      - name: Smoke check (關鍵產物必須存在)
        working-directory: web
        run: |
          for f in out/index.html out/intelligences/index.html out/sitemap.xml out/404.html; do
            test -s "$f" || { echo "缺關鍵產物: $f"; exit 1; }
          done
          grep -q "intelligences" out/sitemap.xml || { echo "sitemap 缺 intelligences"; exit 1; }

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
