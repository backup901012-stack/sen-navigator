name: Update waiting data (monthly)

on:
  schedule:
    # 社署每月更新輪候冊；香港時間每月 3 號與 10 號早上 09:17（UTC+8 → UTC 01:17）雙保險
    - cron: "17 1 3 * *"
    - cron: "17 1 10 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: 抓社署 CSV 並生成 waitingLive.json（驗證不過即紅燈、不污染數據）
        run: node scripts/update_waiting_data.mjs

      - name: 有變動就 commit + push + 觸發部署
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet web/data/waitingLive.json; then
            echo "數據無變動、不需部署"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/waitingLive.json
          git commit -m "data: 自動更新社署輪候數據（$(node -e "console.log(require('./web/data/waitingLive.json').asOf)")）"
          git push
          # GITHUB_TOKEN 的 push 不會自動觸發其他 workflow、需明確 dispatch 部署
          gh workflow run deploy.yml --ref main
